<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Makana Villa Zambales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1710;
    --ink-2:#2b2419;
    --gold:#c3a06a;
    --gold-soft:#e6cd9a;
    --cream:#f4efe4;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  body{
    font-family:'Jost', sans-serif;
    color:var(--cream);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    overflow:hidden;
  }
  .hero-image-wrap{
    position:relative;
    width:100%;
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
    background:var(--ink);
  }
  .hero-photo{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    opacity:0;
    animation:photo-in 1.1s ease-out .1s forwards;
  }
  @keyframes photo-in{
    from{opacity:0;}
    to{opacity:1;}
  }
  @keyframes drift{
    from{ transform: translateY(0); }
    to{ transform: translateY(-14px); }
  }

  .hero-panel{
    position:relative;
    width:100%;
    flex:0 0 auto;
    padding:18px 6vw max(16px, env(safe-area-inset-bottom, 0px));
    display:flex;
    flex-direction:column;
    align-items:center;
    background:var(--ink);
  }
  .hero-panel::before{
    content:'';
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:1px; height:18px;
    background:linear-gradient(to bottom, rgba(195,160,106,.6), transparent);
  }

  .tagline{
    font-size:13.5px;
    font-weight:300;
    letter-spacing:.02em;
    color:rgba(244,239,228,.85);
    max-width:32ch;
    line-height:1.45;
    margin:10px 0 16px;
    opacity:0;
    animation:rise 1s ease-out .55s forwards;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(16px);}
    to{opacity:1; transform:translateY(0);}
  }

  .cta-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    opacity:0;
    animation:rise 1s ease-out .75s forwards, glow 2.6s ease-in-out 1.9s infinite;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:11px 16px;
    border-radius:999px;
    text-decoration:none;
    font-size:12.5px;
    letter-spacing:.03em;
    font-weight:500;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{
    background:linear-gradient(135deg, var(--gold-soft), var(--gold));
    color:#241505;
    box-shadow:0 8px 24px -8px rgba(195,160,106,.65);
  }
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 12px 28px -8px rgba(195,160,106,.8);}
  .btn-ghost{
    background:rgba(244,239,228,.08);
    border:1px solid rgba(244,239,228,.35);
    color:var(--cream);
    backdrop-filter:blur(6px);
  }
  .btn-ghost:hover{background:rgba(244,239,228,.16); transform:translateY(-2px);}
  .btn svg{width:14px; height:14px; flex-shrink:0;}

  @keyframes glow{
    0%,100%{ filter:drop-shadow(0 0 0 rgba(195,160,106,0)); }
    50%{ filter:drop-shadow(0 0 10px rgba(195,160,106,.45)); }
  }

  /* ---------- CONNECT SECTION ---------- */
  .connect{
    position:relative;
    background:var(--ink-2);
    padding:64px 6vw 30px;
  }
  .connect::before{
    content:'';
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:1px; height:40px;
    background:linear-gradient(to bottom, rgba(195,160,106,.6), transparent);
  }
  .connect-label{
    text-align:center;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:400;
    font-size:1.5rem;
    color:var(--gold-soft);
    margin:0 0 6px;
  }
  .connect-sub{
    text-align:center;
    font-size:13px;
    color:rgba(244,239,228,.55);
    margin:0 0 36px;
    line-height:1.6;
  }
  .link-list{
    max-width:480px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .link-card{
    display:flex;
    align-items:center;
    gap:16px;
    padding:18px 20px;
    border-radius:16px;
    background:rgba(244,239,228,.04);
    border:1px solid rgba(195,160,106,.22);
    text-decoration:none;
    transition:border-color .3s ease, background .3s ease, transform .3s ease;
  }
  .link-card:hover{
    border-color:rgba(195,160,106,.6);
    background:rgba(195,160,106,.07);
    transform:translateY(-2px);
  }
  .icon-badge{
    flex-shrink:0;
    width:42px;height:42px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(195,160,106,.12);
    border:1px solid rgba(195,160,106,.35);
  }
  .icon-badge svg{width:19px;height:19px; color:var(--gold-soft);}
  .link-text{flex:1; min-width:0;}
  .link-title{
    font-size:14.5px;
    font-weight:500;
    letter-spacing:.02em;
    margin-bottom:2px;
  }
  .link-desc{
    font-size:12px;
    color:rgba(244,239,228,.55);
    line-height:1.4;
  }
  .link-arrow{flex-shrink:0; opacity:.55; width:14px; height:14px;}

  footer{
    text-align:center;
    padding:44px 6vw 40px;
    background:var(--ink-2);
  }
  footer .fname{
    font-family:'Fraunces', serif;
    font-size:15px;
    letter-spacing:.06em;
    color:var(--gold-soft);
    margin-bottom:6px;
  }
  footer .floc{
    font-size:11.5px;
    color:rgba(244,239,228,.4);
    letter-spacing:.05em;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important;}
  }
</style>
</head>
