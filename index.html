<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Makana Villa Zambales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b1a17;
    --ink-2:#0f231f;
    --gold:#d9a855;
    --gold-soft:#f2ce85;
    --cream:#f7f2e9;
    --teal:#12332b;
    --night:#16324a;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  body{
    font-family:'Jost', sans-serif;
    color:var(--cream);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    text-align:center;
    padding:8vh 6vw 5vh;
    overflow:hidden;
  }
  .hero-bg{
    position:absolute;
    inset:0;
    background-image:url("IMG_20260926_000046.jpg");
    background-position:center 30%;
    transform:scale(1.06);
    filter:saturate(1.05);
  }
  .hero-scrim{
    position:absolute;
    inset:0;
    background:
      linear-gradient(to bottom, rgba(6,12,10,.55) 0%, rgba(6,12,10,.15) 30%, rgba(7,15,13,.55) 62%, rgba(6,12,10,.94) 100%);
  }
  .lights{position:absolute; inset:0; pointer-events:none;}
  .spark{
    position:absolute;
    width:3px;height:3px;
    border-radius:50%;
    background:var(--gold-soft);
    box-shadow:0 0 6px 2px rgba(242,206,133,.85);
    opacity:0;
    animation:twinkle 4.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0; transform:scale(.6);}
    50%{opacity:1; transform:scale(1.15);}
  }
  @keyframes drift{
    from{ transform: translateY(0); }
    to{ transform: translateY(-14px); }
  }

  .hero-content{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center;}

  .wordmark{
    font-family:'Jost', sans-serif;
    font-size:12px;
    letter-spacing:.42em;
    font-weight:500;
    color:var(--gold-soft);
    margin:0 0 22px;
    opacity:0;
    animation:rise .9s ease-out .15s forwards;
  }
  .brand-logo{
    width:min(30vw, 110px);
    height:auto;
    margin:0 0 20px;
    filter:drop-shadow(0 4px 18px rgba(0,0,0,.45));
    opacity:0;
    animation:rise 1s ease-out .3s forwards;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-size:clamp(2.6rem, 9vw, 4.4rem);
    line-height:1.02;
    margin:0 0 14px;
    letter-spacing:.005em;
    opacity:0;
    animation:rise 1s ease-out .35s forwards;
  }
  h1 em{
    font-style:italic;
    font-weight:300;
    color:var(--gold-soft);
  }
  .tagline{
    font-size:15px;
    font-weight:300;
    letter-spacing:.02em;
    color:rgba(247,242,233,.82);
    max-width:30ch;
    line-height:1.6;
    margin:0 0 34px;
    opacity:0;
    animation:rise 1s ease-out .55s forwards;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(16px);}
    to{opacity:1; transform:translateY(0);}
  }

  .cta-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    opacity:0;
    animation:rise 1s ease-out .75s forwards;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:13px 22px;
    border-radius:999px;
    text-decoration:none;
    font-size:13.5px;
    letter-spacing:.04em;
    font-weight:500;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{
    background:linear-gradient(135deg, var(--gold-soft), var(--gold));
    color:#241505;
    box-shadow:0 8px 24px -8px rgba(217,168,85,.65);
  }
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 12px 28px -8px rgba(217,168,85,.8);}
  .btn-ghost{
    background:rgba(247,242,233,.08);
    border:1px solid rgba(247,242,233,.35);
    color:var(--cream);
    backdrop-filter:blur(6px);
  }
  .btn-ghost:hover{background:rgba(247,242,233,.16); transform:translateY(-2px);}
  .btn svg{width:15px; height:15px; flex-shrink:0;}

  .scroll-cue{
    position:relative;
    z-index:2;
    margin-top:44px;
    width:1px;
    height:34px;
    background:linear-gradient(to bottom, rgba(242,206,133,.9), transparent);
    animation:drift 1.6s ease-in-out infinite alternate;
    opacity:0;
    animation:rise 1s ease-out 1s forwards, drift 1.8s ease-in-out 1.9s infinite alternate;
  }

  /* ---------- CONNECT SECTION ---------- */
  .connect{
    position:relative;
    background:var(--ink-2);
    padding:64px 6vw 30px;
  }
  .connect::before{
    content:'';
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:1px; height:40px;
    background:linear-gradient(to bottom, rgba(217,168,85,.6), transparent);
  }
  .connect-label{
    text-align:center;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:400;
    font-size:1.5rem;
    color:var(--gold-soft);
    margin:0 0 6px;
  }
  .connect-sub{
    text-align:center;
    font-size:13px;
    color:rgba(247,242,233,.55);
    margin:0 0 36px;
    line-height:1.6;
  }
  .link-list{
    max-width:480px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .link-card{
    display:flex;
    align-items:center;
    gap:16px;
    padding:18px 20px;
    border-radius:16px;
    background:rgba(247,242,233,.04);
    border:1px solid rgba(217,168,85,.22);
    text-decoration:none;
    transition:border-color .3s ease, background .3s ease, transform .3s ease;
  }
  .link-card:hover{
    border-color:rgba(217,168,85,.6);
    background:rgba(217,168,85,.07);
    transform:translateY(-2px);
  }
  .icon-badge{
    flex-shrink:0;
    width:42px;height:42px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(217,168,85,.12);
    border:1px solid rgba(217,168,85,.35);
  }
  .icon-badge svg{width:19px;height:19px; color:var(--gold-soft);}
  .link-text{flex:1; min-width:0;}
  .link-title{
    font-size:14.5px;
    font-weight:500;
    letter-spacing:.02em;
    margin-bottom:2px;
  }
  .link-desc{
    font-size:12px;
    color:rgba(247,242,233,.55);
    line-height:1.4;
  }
  .link-arrow{flex-shrink:0; opacity:.55; width:14px; height:14px;}

  footer{
    text-align:center;
    padding:44px 6vw 40px;
    background:var(--ink-2);
  }
  footer .fname{
    font-family:'Fraunces', serif;
    font-size:15px;
    letter-spacing:.06em;
    color:var(--gold-soft);
    margin-bottom:6px;
  }
  footer .floc{
    font-size:11.5px;
    color:rgba(247,242,233,.4);
    letter-spacing:.05em;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important;}
    .spark{display:none;}
  }
</style>
</head>
<body>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-scrim"></div>
  <div class="lights" id="lights"></div>

  <div class="hero-content">
    <p class="wordmark">ZAMBALES · PHILIPPINES</p>
    <img class="brand-logo" src="Messenger_creation_D4C5671A-928A-431C-B017-329A3BD7CE22.png" alt="Makana Villa Logo">
    <h1>Makana <em>Villa</em></h1>
    <p class="tagline">A private garden villa for weddings, gatherings, and quiet escapes by the coast.</p>
    <div class="cta-row">
      <a href="#" class="btn btn-primary">Book Your Stay</a>
      <a href="#" class="btn btn-ghost">Instagram</a>
      <a href="#" class="btn btn-ghost">Facebook</a>
    </div>
  </div>
</section>

</body>
</html>
