<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Makana Villa Zambales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b1a17;
    --ink-2:#0f231f;
    --gold:#d9a855;
    --gold-soft:#f2ce85;
    --cream:#f7f2e9;
    --teal:#12332b;
    --night:#16324a;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  body{
    font-family:'Jost', sans-serif;
    color:var(--cream);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    text-align:center;
    padding:8vh 6vw 5vh;
    overflow:hidden;
  }
  .hero-bg{
    position:absolute;
    inset:0;
    /* Replaced broken base64 string with a live image URL */
    background-image:url("https://images.unsplash.com/photo-1499793983690-e29da59ef1c2?auto=format&fit=crop&w=2000&q=80");
    background-size: cover;
    background-position: center;
    z-index: -1; 
  }
  
  /* Added some basic styling for the text */
  h1 {
    font-family: 'Fraunces', serif;
    color: var(--gold);
    margin: 0 0 10px 0;
  }
</style>
</head>
<body>
  
  <div class="hero">
    <div class="hero-bg"></div>
    <h1>Makana Villa</h1>
    <p>Your Zambales getaway.</p>
  </div>

</body>
</html>
